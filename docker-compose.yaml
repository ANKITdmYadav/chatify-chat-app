services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    expose:
      - "5000"
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge